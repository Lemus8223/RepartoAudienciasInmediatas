            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <img src={`data:image/png;base64,${window.LOGO_RAMA}`} alt="Rama Judicial" className="w-24 h-24 mx-auto mb-4 object-contain" />
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">Sistema de Reparto Complejas</h1>
                            <p className="text-sm text-gray-600">Centro de Servicios Judiciales Soacha</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Usuario</label>
                                <input type="text" value={username} onChange={e => setUsername(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Ingrese su usuario" required autoFocus />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Ingrese su contraseña" required />
                            </div>
                            {error && <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">⚠️ {error}</div>}
                            <button type="submit" disabled={loading}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                                {loading ? 'Verificando...' : 'Iniciar Sesión'}
                            </button>
                        </form>
                        <div className="mt-6 pt-6 border-t border-gray-200 text-center">
                            <p className="text-xs text-gray-500">Acceso restringido solo a personal autorizado</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ─── APP ROOT ────────────────────────────────────────────────────────────
        const App = () => {
            const [authenticated, setAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState('');

            useEffect(() => {
                const isAuth = sessionStorage.getItem('authenticated') === 'true';
                const user = sessionStorage.getItem('username');
                if (isAuth && user) { setAuthenticated(true); setCurrentUser(user); }
            }, []);

            const handleLogout = () => {
                if (confirm('¿Está seguro que desea cerrar sesión?')) {
                    sessionStorage.removeItem('authenticated');
                    sessionStorage.removeItem('username');
                    setAuthenticated(false);
                    setCurrentUser('');
                }
            };

            if (!authenticated) return <LoginScreen onLoginSuccess={(u) => { setAuthenticated(true); setCurrentUser(u); }} />;
            return <RepartoAudiencias currentUser={currentUser} onLogout={handleLogout} />;
        };

        // ─── REPARTO PRINCIPAL ───────────────────────────────────────────────────
        const RepartoAudiencias = ({ currentUser, onLogout }) => {
            const [juzgados, setJuzgados] = useState([]);
            const [historial, setHistorial] = useState([]);
            const [siguienteJuzgado, setSiguienteJuzgado] = useState(null);
            const [tipoAudiencia, setTipoAudiencia] = useState('');
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState(null);
            const [ultimaActualizacion, setUltimaActualizacion] = useState(null);

            const leerGoogleSheets = async () => {
                try {
                    setLoading(true);
                    setError(null);

                    // Leer Juzgados
                    const rJ = await fetch(BASE_URL + 'Juzgados');
                    const tJ = await rJ.text();
                    const jJson = parseGvizResponse(tJ);
                    const juzgadosData = jJson.table.rows.map(row => ({
                        id: row.c[0]?.v || 0,
                        nombre: row.c[1]?.v || '',
                        audiencias: row.c[2]?.v || 0,
                        activo: row.c[3]?.v === true || row.c[3]?.v === 'TRUE' || row.c[3]?.v === 'true',
                        motivoInactivo: row.c[4]?.v || ''
                    }));

                    // Leer Historial
                    const rH = await fetch(BASE_URL + 'Historial');
                    const tH = await rH.text();
                    const hJson = parseGvizResponse(tH);
                    const historialData = hJson.table.rows
                        .filter(row => row.c[0]?.v)
                        .map(row => ({
                            audienciaNum: row.c[0]?.v || 0,
                            fecha: row.c[1]?.v || '',
                            juzgado: row.c[2]?.v || '',
                            tipo: row.c[3]?.v || ''
                        }));

                    setJuzgados(juzgadosData);
                    setHistorial(historialData);
                    setUltimaActualizacion(new Date().toLocaleTimeString('es-CO'));
                    setLoading(false);
                } catch (err) {
                    console.error('Error al leer Google Sheets:', err);
                    setError('Error al cargar datos: ' + err.message);
                    setLoading(false);
                }
            };

            const guardarAudiencia = async (audienciaData) => {
                try {
                    setSaving(true);
                    await fetch(WEB_APP_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'agregarAudiencia', ...audienciaData })
                    });
                    setSaving(false);
                    return true;
                } catch (err) {
                    console.error('Error al guardar:', err);
                    setSaving(false);
                    return false;
                }
            };

            const actualizarJuzgadoEnSheet = async (juzgadoData) => {
                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'actualizarJuzgado', ...juzgadoData })
                    });
                    return true;
                } catch (err) {
                    console.error('Error al actualizar juzgado:', err);
                    return false;
                }
            };

            useEffect(() => {
                leerGoogleSheets();
                const interval = setInterval(leerGoogleSheets, 15000);
                return () => clearInterval(interval);
            }, []);

            const calcularSiguienteJuzgado = () => {
                const activos = juzgados.filter(j => j.activo);
                if (activos.length === 0) return null;
                const minAud = Math.min(...activos.map(j => j.audiencias));
                const candidatos = activos.filter(j => j.audiencias === minAud);
                return candidatos.length === 1 ? candidatos[0] : candidatos.reduce((p, c) => p.id < c.id ? p : c);
            };

            useEffect(() => { setSiguienteJuzgado(calcularSiguienteJuzgado()); }, [juzgados]);

            const toggleJuzgado = async (id, motivo = '') => {
                const juzgado = juzgados.find(j => j.id === id);
                const nuevoEstado = !juzgado.activo;
                setJuzgados(juzgados.map(j => j.id === id ? { ...j, activo: nuevoEstado, motivoInactivo: nuevoEstado ? '' : motivo } : j));
                await actualizarJuzgadoEnSheet({ id, audiencias: juzgado.audiencias, activo: nuevoEstado, motivoInactivo: nuevoEstado ? '' : motivo });
                setTimeout(() => leerGoogleSheets(), 2000);
            };

            const asignarAudiencia = async () => {
                if (!siguienteJuzgado || !tipoAudiencia.trim()) { alert('Por favor ingrese el CUI de la audiencia'); return; }
                const ultimoNumero = historial.length > 0 ? Math.max(...historial.map(h => h.audienciaNum || 0)) : 0;
                const nuevaEntrada = {
                    audienciaNum: ultimoNumero + 1,
                    fecha: new Date().toLocaleString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                    juzgado: siguienteJuzgado.nombre,
                    tipo: tipoAudiencia,
                    nuevasAudiencias: siguienteJuzgado.audiencias + 1
                };
                setHistorial([nuevaEntrada, ...historial]);
                setJuzgados(juzgados.map(j => j.id === siguienteJuzgado.id ? { ...j, audiencias: j.audiencias + 1 } : j));
                setTipoAudiencia('');
                const guardado = await guardarAudiencia(nuevaEntrada);
                if (guardado) {
                    alert(`✅ Audiencia asignada a ${siguienteJuzgado.nombre} y guardada en Google Sheets`);
                    setTimeout(() => leerGoogleSheets(), 3000);
                } else {
                    alert(`⚠️ La audiencia se asignó localmente pero puede haber un problema al guardar.`);
                }
            };

            const ajustarAudiencias = async (id, cantidad) => {
                const juzgado = juzgados.find(j => j.id === id);
                const nuevas = Math.max(0, juzgado.audiencias + cantidad);
                setJuzgados(juzgados.map(j => j.id === id ? { ...j, audiencias: nuevas } : j));
                await actualizarJuzgadoEnSheet({ id, audiencias: nuevas, activo: juzgado.activo, motivoInactivo: juzgado.motivoInactivo });
                setTimeout(() => leerGoogleSheets(), 2000);
            };

            const exportarCSV = () => {
                let csv = 'N°,Fecha/Hora,Juzgado,Tipo de Audiencia\n';
                historial.slice().reverse().forEach(e => { csv += `${e.audienciaNum},"${e.fecha}","${e.juzgado}","${e.tipo}"\n`; });
                csv += '\n\nResumen de Juzgados\nJuzgado,Audiencias,Estado,Motivo Inactivo\n';
                juzgados.forEach(j => { csv += `"${j.nombre}",${j.audiencias},"${j.activo ? 'Activo' : 'Inactivo'}","${j.motivoInactivo}"\n`; });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `reparto-audiencias-${Date.now()}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            };

            if (loading && juzgados.length === 0) return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <div className="loading mb-4"></div>
                    <p className="text-gray-600">Cargando datos desde Google Sheets...</p>
                </div>
            );

            if (error && juzgados.length === 0) return (
                <div className="bg-red-50 border-2 border-red-500 rounded-lg p-6 m-6">
                    <h2 className="text-xl font-bold text-red-800 mb-2">❌ Error de Conexión</h2>
                    <p className="text-red-700 mb-2">{error}</p>
                    <p className="text-red-600 text-sm mb-4">Verifique que la hoja de Google Sheets sea pública (Cualquiera con el enlace puede ver).</p>
                    <button onClick={leerGoogleSheets} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg">Reintentar</button>
                </div>
            );

            const juzgadosActivos = juzgados.filter(j => j.activo);
            const juzgadosInactivos = juzgados.filter(j => !j.activo);

            return (
                <div>
                    {/* Header */}
                    <div className="header-container mb-6">
                        <div className="flex items-center justify-between gap-4 mb-4">
                            <img src={`data:image/png;base64,${window.LOGO_RAMA}`} alt="Rama Judicial" className="w-36 h-36 object-contain flex-shrink-0" />
                            <div className="flex-1 text-center px-4">
                                <h1 className="text-2xl md:text-3xl font-bold text-white mb-2">Sistema de Reparto de Audiencias Complejas</h1>
                                <p className="text-sm md:text-base text-white opacity-90">Centro de Servicios Judiciales Soacha Cundinamarca</p>
                                <p className="text-xs text-white opacity-75 mt-1">República de Colombia</p>
                            </div>
                            <img src={`data:image/png;base64,${window.LOGO_ING}`} alt="Ingeniería de Sistemas" className="w-24 h-24 object-contain flex-shrink-0" />
                        </div>
                        <div className="bg-white bg-opacity-20 rounded-lg p-4 backdrop-blur-sm">
                            <div className="flex flex-wrap justify-between items-center gap-4">
                                <div className="text-white">
                                    <p className="text-sm font-medium">Juzgados 1, 3, 5, 6, 7 — Reparto Secuencial Compensado</p>
                                    <p className="text-xs mt-1 opacity-90">✅ Conectado — Guardado automático activado</p>
                                    {ultimaActualizacion && <p className="text-xs opacity-75 mt-1">Última actualización: {ultimaActualizacion}</p>}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={leerGoogleSheets} disabled={loading}
                                        className="px-4 py-2 bg-white text-blue-700 hover:bg-gray-100 rounded-lg text-sm font-medium shadow-md transition-all">
                                        {loading ? '⏳' : '🔄'} Actualizar
                                    </button>
                                    <button onClick={() => window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank')}
                                        className="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg text-sm font-medium shadow-md transition-all">
                                        📊 Abrir Sheet
                                    </button>
                                    <button onClick={onLogout}
                                        className="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-medium shadow-md transition-all">
                                        🚪 Salir
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Usuario activo */}
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 rounded">
                        <p className="text-sm text-blue-800"><span className="font-semibold">Usuario activo:</span> {currentUser}</p>
                    </div>

                    {/* Estado juzgados */}
                    <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">📅 Estado de Juzgados</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            {juzgados.map(juzgado => (
                                <div key={juzgado.id} className={`p-4 rounded-lg border-2 ${juzgado.activo ? (juzgado.id === siguienteJuzgado?.id ? 'border-green-500 bg-green-50' : 'border-gray-300 bg-white') : 'border-red-300 bg-red-50'}`}>
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center">
                                            <h3 className="text-lg font-semibold">{juzgado.nombre}</h3>
                                            {juzgado.id === siguienteJuzgado?.id && juzgado.activo && (
                                                <span className="ml-2 px-2 py-1 bg-green-500 text-white text-xs rounded-full">SIGUIENTE</span>
                                            )}
                                        </div>
                                        <button onClick={() => {
                                            if (!juzgado.activo) { toggleJuzgado(juzgado.id); }
                                            else { const m = prompt('Motivo de ausencia (permiso/incapacidad/compensatorio):'); if (m) toggleJuzgado(juzgado.id, m); }
                                        }} className={`px-3 py-1 rounded ${juzgado.activo ? 'bg-gray-500 hover:bg-gray-600' : 'bg-blue-500 hover:bg-blue-600'} text-white text-sm`}>
                                            {juzgado.activo ? 'Ausente' : 'Reintegrar'}
                                        </button>
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-2xl font-bold text-gray-700">{juzgado.audiencias}</p>
                                            <p className="text-sm text-gray-500">Audiencias asignadas</p>
                                            {!juzgado.activo && <p className="text-xs text-red-600 mt-1">⚠️ {juzgado.motivoInactivo}</p>}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => ajustarAudiencias(juzgado.id, -1)} className="p-2 bg-red-100 hover:bg-red-200 rounded" title="Reducir audiencias">
                                                <span className="text-red-600 font-bold">−</span>
                                            </button>
                                            <button onClick={() => ajustarAudiencias(juzgado.id, 1)} className="p-2 bg-blue-100 hover:bg-blue-200 rounded" title="Aumentar audiencias">
                                                <span className="text-blue-600 font-bold">+</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-3 gap-4 p-4 bg-gray-100 rounded-lg">
                            <div className="text-center">
                                <p className="text-sm text-gray-600">Juzgados Activos</p>
                                <p className="text-2xl font-bold text-green-600">{juzgadosActivos.length}</p>
                            </div>
                            <div className="text-center">
                                <p className="text-sm text-gray-600">Juzgados Ausentes</p>
                                <p className="text-2xl font-bold text-red-600">{juzgadosInactivos.length}</p>
                            </div>
                            <div className="text-center">
                                <p className="text-sm text-gray-600">Total Audiencias</p>
                                <p className="text-2xl font-bold text-blue-600">{juzgados.reduce((sum, j) => sum + j.audiencias, 0)}</p>
                            </div>
                        </div>
                    </div>

                    {/* Asignar audiencia */}
                    <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">📝 Asignar Nueva Audiencia</h2>
                        {siguienteJuzgado ? (
                            <div className="space-y-4">
                                <div className="p-4 bg-green-50 border-2 border-green-500 rounded-lg">
                                    <p className="text-sm text-gray-600 mb-1">Próxima audiencia será asignada a:</p>
                                    <p className="text-2xl font-bold text-green-700">{siguienteJuzgado.nombre}</p>
                                    <p className="text-sm text-gray-600 mt-1">Audiencias actuales: {siguienteJuzgado.audiencias}</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Código Único de Identificación / CUI</label>
                                    <input type="text" value={tipoAudiencia} onChange={e => setTipoAudiencia(e.target.value)}
                                        placeholder="Ej: 257546000392202500001"
                                        className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                        onKeyPress={e => e.key === 'Enter' && asignarAudiencia()} />
                                </div>
                                <button onClick={asignarAudiencia} disabled={saving}
                                    className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors disabled:bg-gray-400">
                                    {saving ? '💾 Guardando...' : '✅ Asignar y Guardar Audiencia'}
                                </button>
                            </div>
                        ) : (
                            <div className="p-4 bg-yellow-50 border-2 border-yellow-500 rounded-lg">
                                <span className="text-yellow-800 font-medium">⚠️ No hay juzgados activos disponibles. Reactive al menos un juzgado para continuar.</span>
                            </div>
                        )}
                    </div>

                    {/* Historial */}
                    <div className="bg-white rounded-lg shadow-lg p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800">📋 Historial de Reparto</h2>
                            <button onClick={exportarCSV} className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm">📥 Exportar CSV</button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-gray-100">
                                    <tr>
                                        <th className="px-4 py-2 text-left text-sm font-semibold text-gray-700">#</th>
                                        <th className="px-4 py-2 text-left text-sm font-semibold text-gray-700">Fecha/Hora</th>
                                        <th className="px-4 py-2 text-left text-sm font-semibold text-gray-700">Juzgado</th>
                                        <th className="px-4 py-2 text-left text-sm font-semibold text-gray-700">CUI</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {historial.length === 0 ? (
                                        <tr><td colSpan="4" className="px-4 py-8 text-center text-gray-500">No hay audiencias registradas aún</td></tr>
                                    ) : (
                                        historial.slice().reverse().map((entrada, index) => (
                                            <tr key={index} className="border-b border-gray-200 hover:bg-gray-50">
                                                <td className="px-4 py-3 text-sm">{entrada.audienciaNum}</td>
                                                <td className="px-4 py-3 text-sm">{entrada.fecha}</td>
                                                <td className="px-4 py-3 text-sm font-semibold">{entrada.juzgado}</td>
                                                <td className="px-4 py-3 text-sm">{entrada.tipo}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-gradient-to-r from-gray-800 to-gray-900 text-white rounded-lg shadow-lg p-6 mt-6">
                        <div className="max-w-4xl mx-auto">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <h3 className="text-lg font-bold mb-3 text-blue-300">Desarrollado por</h3>
                                    <p className="text-sm mb-1"><span className="font-semibold">Ing. Edgar A Hernández Lemus</span></p>
                                    <p className="text-sm text-gray-300 mb-1">📍 Carrera 4 N° 38-66 Piso 1</p>
                                    <p className="text-sm text-gray-300">Soacha, Cundinamarca</p>
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold mb-3 text-blue-300">Contacto</h3>
                                    <p className="text-sm mb-2">📱 <a href="tel:3166245436" className="hover:text-blue-300">3166245436</a></p>
                                    <p className="text-sm">📧 <a href="mailto:ehernanle@cendoj.ramajudicial.gov.co" className="hover:text-blue-300 break-all">ehernanle@cendoj.ramajudicial.gov.co</a></p>
                                </div>
                            </div>
                            <div className="border-t border-gray-700 mt-6 pt-4 text-center">
                                <p className="text-xs text-gray-400">© {new Date().getFullYear()} Centro de Servicios Judiciales Soacha — Rama Judicial</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const rootElement = document.getElementById('app');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
