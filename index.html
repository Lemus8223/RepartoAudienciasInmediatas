<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reparto de Audiencias - CSJ Soacha</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; min-height: 100vh; }

        /* ── Spinner ── */
        .spinner { width:40px;height:40px;border:4px solid #e2e8f0;border-top:4px solid #3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem; }
        @keyframes spin{ to{transform:rotate(360deg)} }

        /* ── Layout ── */
        #app { max-width:1100px;margin:0 auto;padding:1.5rem; }

        /* ── LOGIN ── */
        #login-screen { min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#3b82f6,#1e40af);padding:1rem; }
        .login-card { background:#fff;border-radius:1rem;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:2.5rem;width:100%;max-width:420px; }
        .login-logo { width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 1rem; }
        .login-title { font-size:1.4rem;font-weight:700;color:#1e293b;text-align:center;margin-bottom:.25rem; }
        .login-sub { font-size:.85rem;color:#64748b;text-align:center;margin-bottom:2rem; }
        label { display:block;font-size:.85rem;font-weight:500;color:#374151;margin-bottom:.4rem; }
        input[type=text], input[type=password] { width:100%;padding:.75rem 1rem;border:1.5px solid #d1d5db;border-radius:.5rem;font-size:1rem;outline:none;transition:border-color .2s; }
        input:focus { border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15); }
        .form-group { margin-bottom:1.25rem; }
        .btn { display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.75rem 1.25rem;border:none;border-radius:.5rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none; }
        .btn-primary { background:#2563eb;color:#fff;width:100%; }
        .btn-primary:hover { background:#1d4ed8; }
        .btn-primary:disabled { background:#9ca3af;cursor:not-allowed; }
        .btn-secondary { background:#fff;color:#2563eb;border:1.5px solid #2563eb; }
        .btn-secondary:hover { background:#eff6ff; }
        .btn-green { background:#16a34a;color:#fff; }
        .btn-green:hover { background:#15803d; }
        .btn-red { background:#dc2626;color:#fff; }
        .btn-red:hover { background:#b91c1c; }
        .btn-gray { background:#6b7280;color:#fff; }
        .btn-gray:hover { background:#4b5563; }
        .btn-outline-red { background:#fee2e2;color:#dc2626;border:1px solid #fca5a5; }
        .btn-outline-blue { background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd; }
        .alert { padding:.75rem 1rem;border-radius:.5rem;font-size:.875rem;margin-bottom:1rem; }
        .alert-error { background:#fef2f2;border:1px solid #fecaca;color:#dc2626; }
        .alert-warning { background:#fffbeb;border:2px solid #fbbf24;color:#92400e; }

        /* ── HEADER ── */
        .header-container { background:linear-gradient(135deg,#1e3a8a,#3b82f6,#1e40af);border-radius:.75rem;padding:1.5rem;box-shadow:0 8px 20px rgba(0,0,0,.2);margin-bottom:1.5rem; }
        .header-inner { display:flex;align-items:center;gap:1rem;margin-bottom:1rem; }
        .header-logo { width:140px;height:140px;object-fit:contain;flex-shrink:0; }
        .header-logo-sm { width:90px;height:90px;object-fit:contain;flex-shrink:0; }
        .header-text { flex:1;text-align:center; }
        .header-text h1 { font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:.3rem; }
        .header-text p { color:rgba(255,255,255,.9);font-size:.9rem; }
        .header-text small { color:rgba(255,255,255,.7);font-size:.75rem; }
        .header-toolbar { background:rgba(255,255,255,.2);border-radius:.5rem;padding:1rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem; }
        .header-info { color:#fff; }
        .header-info p { font-size:.85rem;font-weight:500; }
        .header-info small { font-size:.75rem;opacity:.85; }
        .btn-group { display:flex;gap:.5rem;flex-wrap:wrap; }

        /* ── CARDS ── */
        .card { background:#fff;border-radius:.75rem;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:1.5rem;margin-bottom:1.5rem; }
        .card-title { font-size:1.1rem;font-weight:700;color:#1e293b;margin-bottom:1rem; }
        .user-bar { background:#eff6ff;border-left:4px solid #3b82f6;padding:.75rem 1rem;border-radius:.25rem;margin-bottom:1.5rem;font-size:.875rem;color:#1e40af; }

        /* ── JUZGADOS GRID ── */
        .juzgados-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1rem; }
        .juzgado-card { border:2px solid #e2e8f0;border-radius:.625rem;padding:1rem;background:#fff;transition:border-color .2s; }
        .juzgado-card.activo-siguiente { border-color:#16a34a;background:#f0fdf4; }
        .juzgado-card.inactivo { border-color:#fca5a5;background:#fff5f5; }
        .juzgado-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem; }
        .juzgado-nombre { font-size:1rem;font-weight:700;color:#1e293b; }
        .badge-siguiente { display:inline-block;background:#16a34a;color:#fff;font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;margin-left:.5rem; }
        .juzgado-body { display:flex;align-items:center;justify-content:space-between; }
        .juzgado-count { font-size:2rem;font-weight:800;color:#334155; }
        .juzgado-count-label { font-size:.75rem;color:#64748b; }
        .juzgado-motivo { font-size:.75rem;color:#dc2626;margin-top:.25rem; }
        .adj-buttons { display:flex;gap:.5rem; }
        .adj-btn { width:34px;height:34px;border-radius:.375rem;border:none;cursor:pointer;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .15s; }
        .adj-btn-minus { background:#fee2e2;color:#dc2626; }
        .adj-btn-minus:hover { background:#fecaca; }
        .adj-btn-plus { background:#dbeafe;color:#1d4ed8; }
        .adj-btn-plus:hover { background:#bfdbfe; }

        /* ── STATS BAR ── */
        .stats-bar { display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;background:#f8fafc;border-radius:.5rem;padding:1rem;margin-top:1rem; }
        .stat { text-align:center; }
        .stat-label { font-size:.75rem;color:#64748b;margin-bottom:.2rem; }
        .stat-value { font-size:1.5rem;font-weight:800; }
        .stat-green { color:#16a34a; }
        .stat-red { color:#dc2626; }
        .stat-blue { color:#2563eb; }

        /* ── ASIGNAR ── */
        .siguiente-box { border:2px solid #16a34a;background:#f0fdf4;border-radius:.5rem;padding:1rem;margin-bottom:1rem; }
        .siguiente-label { font-size:.8rem;color:#64748b;margin-bottom:.25rem; }
        .siguiente-nombre { font-size:1.5rem;font-weight:800;color:#15803d; }
        .siguiente-sub { font-size:.8rem;color:#64748b;margin-top:.25rem; }
        .cui-input { width:100%;padding:.75rem 1rem;border:1.5px solid #d1d5db;border-radius:.5rem;font-size:1rem;margin-top:.4rem;outline:none; }
        .cui-input:focus { border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15); }

        /* ── TABLA ── */
        .table-wrap { overflow-x:auto; }
        table { width:100%;border-collapse:collapse;font-size:.875rem; }
        thead th { background:#f1f5f9;padding:.6rem 1rem;text-align:left;font-weight:600;color:#475569;white-space:nowrap; }
        tbody tr { border-bottom:1px solid #f1f5f9; }
        tbody tr:hover { background:#f8fafc; }
        tbody td { padding:.7rem 1rem;color:#334155; }

        /* ── FOOTER ── */
        footer { background:linear-gradient(90deg,#1f2937,#111827);color:#fff;border-radius:.75rem;padding:1.5rem;margin-top:1.5rem; }
        .footer-grid { display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1rem; }
        .footer-title { font-size:.95rem;font-weight:700;color:#93c5fd;margin-bottom:.5rem; }
        .footer-desc { font-size:.8rem;color:#9ca3af;line-height:1.4; }
    </style>
</head>
<body>

    <div id="app">
        <!-- Contenedor dinámico controlado por JavaScript -->
        <div id="main-content">
            <div style="text-align:center; padding:3rem;">
                <div class="spinner"></div>
                <p>Cargando el sistema...</p>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN CENTRALIZADA - REEMPLAZA CON TU NUEVA URL DE IMPLEMENTACIÓN DE APP SCRIPT
        var API_WEB_URL = 'https://google.com'; 

        // Función crítica corregida para evitar problemas de CORS y asegurar el envío de datos
        async function enviarPeticionWeb(payload) {
            try {
                // Enviamos como text/plain para evitar que el navegador envíe una solicitud OPTIONS (Pre-flight) que Google bloquea
                const respuesta = await fetch(API_WEB_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (!respuesta.ok) {
                    throw new Error('Error en la red del servidor: ' + respuesta.statusText);
                }
                
                const texto = await respuesta.text();
                return JSON.parse(texto);
            } catch (error) {
                console.error("Error crítico de sincronización con Sheets:", error);
                return { success: false, error: error.message };
            }
        }
