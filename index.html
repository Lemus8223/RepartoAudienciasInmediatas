<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reparto de Audiencias - CSJ Soacha</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; min-height: 100vh; }

        /* ── Spinner ── */
        .spinner { width:40px;height:40px;border:4px solid #e2e8f0;border-top:4px solid #3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem; }
        @keyframes spin{ to{transform:rotate(360deg)} }

        /* ── Layout ── */
        #app { max-width:1100px;margin:0 auto;padding:1.5rem; }

        /* ── CARDS ── */
        .card { background:#fff;border-radius:.75rem;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:1.5rem;margin-bottom:1.5rem; }
        .card-title { font-size:1.1rem;font-weight:700;color:#1e293b;margin-bottom:1rem; }

        /* ── HEADER ── */
        .header-container { background:linear-gradient(135deg,#1e3a8a,#3b82f6,#1e40af);border-radius:.75rem;padding:1.5rem;box-shadow:0 8px 20px rgba(0,0,0,.2);margin-bottom:1.5rem; }
        .header-text { text-align:center; }
        .header-text h1 { font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:.3rem; }
        .header-text p { color:rgba(255,255,255,.9);font-size:.9rem; }

        /* ── JUZGADOS GRID ── */
        .juzgados-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1rem; }
        .juzgado-card { border:2px solid #e2e8f0;border-radius:.625rem;padding:1rem;background:#fff; }
        .juzgado-card.activo-siguiente { border-color:#16a34a;background:#f0fdf4; }
        .juzgado-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem; }
        .juzgado-nombre { font-size:1rem;font-weight:700;color:#1e293b; }
        .juzgado-body { display:flex;align-items:center;justify-content:space-between; }
        .juzgado-count { font-size:2rem;font-weight:800;color:#334155; }
        
        /* Modificaciones del truncado previo */
        .footer-title { font-size:.95rem;font-weight:700;color:#93c5fd;margin-bottom:.5rem; }
        .footer-desc { font-size:.8rem;color:#9ca3af;line-height:1.4; }
    </style>
</head>
<body>

    <div id="app">
        <div id="main-content">
            <div style="text-align:center; padding:3rem;">
                <div class="spinner"></div>
                <p>Cargando datos del Reparto de manera ultra rápida...</p>
            </div>
        </div>
    </div>

    <script>
        // CAMBIA ESTA URL POR LA DE TU NUEVA IMPLEMENTACIÓN DE APPS SCRIPT
        var API_WEB_URL = 'https://script.google.com/macros/s/AKfycbzyrT_3xLRbuw-off0wCWk3iVZJgFw9TcpBnXiv-OuCV2F9QmeqlAcDsGS3TkUB5-87Aw/exec'; 

        // Función base de red optimizada
        async function enviarPeticionWeb(payload) {
            try {
                const respuesta = await fetch(API_WEB_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                if (!respuesta.ok) throw new Error('Error de red');
                const texto = await respuesta.text();
                return JSON.parse(texto);
            } catch (error) {
                console.error("Error en sincronización:", error);
                return { success: false, error: error.message };
            }
        }

        // Carga inicial optimizada al abrir la página web
        async function cargarDatosIniciales() {
            // Solicitud rápida estructurada en memoria en el servidor
            const respuesta = await enviarPeticionWeb({ action: 'obtenerTodo' });
            
            if (respuesta && respuesta.success && respuesta.resultado) {
                renderizarInterfaz(respuesta.resultado);
            } else {
                document.getElementById('main-content').innerHTML = `
                    <div class="card" style="text-align:center;color:#dc2626;">
                        <p>Error al conectar con Google Sheets. Verifica el URL del script e intenta recargar.</p>
                    </div>
                `;
            }
        }

        // Renderizador limpio que respeta tu disposición visual de tarjetas
        function renderizarInterfaz(datos) {
            let htmlJuzgados = '';
            
            datos.juzgados.forEach(juzgado => {
                htmlJuzgados += `
                    <div class="juzgado-card ${juzgado.activo ? 'activo-siguiente' : ''}">
                        <div class="juzgado-header">
                            <span class="juzgado-nombre">${juzgado.nombre}</span>
                        </div>
                        <div class="juzgado-body">
                            <div class="juzgado-count">${juzgado.audiencias}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('main-content').innerHTML = `
                <div class="header-container">
                    <div class="header-text">
                        <h1>Sistema de Reparto de Audiencias</h1>
                        <p>CSJ Soacha - Conexión Optimizada Instantánea</p>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">Estado de Juzgados</div>
                    <div class="juzgados-grid">${htmlJuzgados}</div>
                </div>
            `;
        }

        // Iniciar la carga asíncrona inmediata al cargar el DOM
        window.addEventListener('DOMContentLoaded', cargarDatosIniciales);
    </script>
</body>
</html>
